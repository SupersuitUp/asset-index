name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # No person's name in a public package: the same check the other public @supersuit packages run.
      - run: npm run check:private-words
      # No date in a comment under src/: a dated comment is a diary entry about another app.
      - run: npm run check:comment-dates
      # The consumer check is a stub that skips until test/consumer exists; once it does, it builds
      # an app against the packed tarball.
      - run: npm run check:consumer
